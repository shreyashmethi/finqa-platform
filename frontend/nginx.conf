# Serves the built React app and proxies /api to the backend container (same origin: no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 100m;  # matches FINQA_MAX_UPLOAD_MB

    # Basic hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Client-side routing: unknown paths return the app shell.
    location / {
        try_files $uri /index.html;
    }
}
