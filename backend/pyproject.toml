[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finqa-backend"
version = "0.1.0"
description = "Multi-agent financial QA & reconciliation platform - API and agent runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Optional LLM support (label mapping fallback + exception explanations).
# Any provider supported by langchain's init_chat_model works, e.g. langchain-anthropic.
llm = ["langchain>=0.3", "langchain-anthropic>=0.2"]
# Postgres in production: app DB via psycopg, LangGraph checkpoints via PostgresSaver.
postgres = ["psycopg[binary]>=3.2", "langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/Query()/File() in defaults is the framework's documented idiom.
ignore = ["B008"]
